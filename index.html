<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
    <script src="script.js"></script>
    <title>Arithmagician</title>
</head>
<body>
    <h1>Arithmagician</h1>
    
    <div id="options">
        <label><input type="checkbox" name="operation" id="addition"> Addition</label>
        <label><input type="checkbox" name="operation" id="subtraction"> Subtraction</label>
        <label><input type="checkbox" name="operation" id="multiplication"> Multiplication</label>
        <label><input type="checkbox" name="operation" id="division"> Division</label>
        <label><input type="checkbox" name="operation" id="squares"> Squares</label>
        <label><input type="checkbox" name="operation" id="squareRoots"> Square Roots</label>
        <label><input type="checkbox" id="includeNegatives"> Include Negatives</label>
        <label>Number of Questions: <input type="number" id="questionCount" value="50" min="1"></label>
    </div>

    <div id="controls">
        <button id="generateBtn" type="button">Generate Question(s)</button>
        <button id="checkBtn" type="button">Check Answer</button>

        <label for="mute">Mute</label>
        <input type="checkbox" id="mute" aria-label="Mute sounds">
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.1" aria-label="Volume control">
        <button id="restartBtn" type="button" style="display:none;">Restart</button>
    </div>

    <div id="question-container" role="region" aria-live="polite">
        <!-- Dynamic content will be placed here -->
    </div>
    <div id="answer-container">
        <!-- Dynamic content will be placed here -->
    </div>

    <canvas id="my-canvas"></canvas>
</body>
</html>
